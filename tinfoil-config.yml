cvm-version: 0.14.14
cpus: 2
memory: 8192
gpus: 0
volumes:
  - name: ledger
    owner: 65532
shim:
  upstream-port: 8090
  paths: ['/*']
containers:
  - name: intake-persistent-ledger-replace
    image: ghcr.io/ajbt200128/possums-intake-synthetic@sha256:0e84e836678a3edabe7e4ba6253310002eed6daa45da70b397121a886a34bcb7
    command: ['ledger-replace', '--state', '/state/ledger', '--tinfoil-volume', 'ledger', '--operator', '--discard-existing-ledger']
    user: '65532:65532'
    read_only: true
    restart: 'no'
    persistent_volumes: ['ledger:/state']
    tmpfs:
      /tmp: 'rw,nosuid,nodev,size=128m,mode=1777'
    env:
      - OTEL_SDK_DISABLED: 'true'
    secrets:
      - LEDGER_VOLUME_KEY_B64
      - LEDGER_OPERATOR_EMAIL
      - LEDGER_OPERATOR_PASSWORD
