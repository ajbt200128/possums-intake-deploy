cvm-version: 0.14.14
cpus: 2
memory: 8192
gpus: 0
volumes:
  - name: ledger
    owner: 65532
shim:
  upstream-port: 8090
  paths: ['/*']
containers:
  - name: intake-persistent-website-init
    image: ghcr.io/ajbt200128/possums-intake-synthetic@sha256:53e7927ef2e13a7346051734ac174ab3666cc01c86057d080084b3e2c0a9cb91
    command: ['website-init', '--state', '/state/ledger', '--tinfoil-volume', 'ledger']
    user: '65532:65532'
    read_only: true
    restart: 'no'
    persistent_volumes: ['ledger:/state']
    tmpfs:
      /tmp: 'rw,nosuid,nodev,size=128m,mode=1777'
    env:
      - OTEL_SDK_DISABLED: 'true'
    secrets:
      - LEDGER_VOLUME_KEY_B64
