name: Tinfoil Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly authorize one reviewed synthetic configuration phase release
        required: true
        type: boolean
        default: false
      expected_public_commit:
        description: Reviewed exact current public main / immutable lightweight tag SHA
        required: true
        type: string
      expected_private_source:
        description: Operator-accepted private publication receipt publicSourceSHA
        required: true
        type: string
      expected_image_digest:
        description: Operator-accepted immutable private image digest (sha256 prefix)
        required: true
        type: string
      expected_storage_phase:
        description: Exact committed configuration phase; serve never initializes storage
        required: true
        type: choice
        default: disposable
        options:
          - disposable
          - persistent-bootstrap
          - persistent-ledger-init
          - persistent-ledger-replace
          - persistent-website-init
          - persistent-ledger-upgrade
          - persistent-serve
          - persistent-diagnostic-serve

permissions: {}
concurrency:
  group: synthetic-public-config-release
  cancel-in-progress: false

jobs:
  publish:
    # Operator admitted this synthetic-only activation after private image copy.
    # Every invocation still requires exact source/tag/owner and first-attempt gates.
    if: >-
      ${{ inputs.publish == true && github.event_name == 'workflow_dispatch' &&
          github.repository == 'ajbt200128/possums-intake-deploy' &&
          github.repository_owner == 'ajbt200128' && github.actor == 'ajbt200128' &&
          github.triggering_actor == 'ajbt200128' && github.ref_type == 'tag' &&
          startsWith(github.ref, 'refs/tags/v') && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SYNTHETIC_RELEASE_ENABLED: 'true'
      RELEASE_PUBLISH: ${{ inputs.publish }}
      RELEASE_PUBLIC_SHA: ${{ inputs.expected_public_commit }}
      RELEASE_PRIVATE_SHA: ${{ inputs.expected_private_source }}
      RELEASE_IMAGE_DIGEST: ${{ inputs.expected_image_digest }}
      RELEASE_STORAGE_PHASE: ${{ inputs.expected_storage_phase }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout the actual tag commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline boundary tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Public source and typed absence admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/synthetic-release.py guard
      - name: Official Tinfoil measurement, attestation and publication
        # Same pinned action and ephemeral CI-token boundary as ../possums.
        # The action owns the sole release-create call. No wrapper publication.
        # Parent verifies the completed run, manifest and assets before deployment.
        uses: tinfoilsh/measure-image-action@59f7ab5dbe472b3097c888ebe64e6a4131fc0975 # v0.14.0
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mark-as-latest: 'false'
